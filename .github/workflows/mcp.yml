name: Go MCP and Docker validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp-go/go.mod
          cache-dependency-path: mcp-go/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: go build -o bellwright-mcp .
      - run: node capability-smoke.mjs ./bellwright-mcp
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose with synthetic paths
        env:
          SAVE_DIR: /tmp/bw-ci/saves
          UE4SS_LOG_DIR: /tmp/bw-ci/log
          MAP_ASSETS_DIR: /tmp/bw-ci/map
          RESOURCE_ANALYSIS_DIR: /tmp/bw-ci/resources
        run: docker compose --env-file .env.example config --quiet
      - run: docker build -t bellwright-mcp-ci ./mcp-go
